name: One-time Mode A template syntax repair
on:
  push:
    branches:
      - fix/mode-a-jinja-media-query-syntax
permissions:
  contents: write
jobs:
  repair-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode-a-jinja-media-query-syntax
          fetch-depth: 0
      - name: Repair Jinja CSS selector boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("templates/doccraft.html")
          s = p.read_text()
          count = s.count("{#documentStudioHome")
          if count != 3:
              raise SystemExit(f"Expected 3 accidental Jinja comment openers, found {count}")
          s = s.replace("{#documentStudioHome", "{ #documentStudioHome")
          if "{#" in s:
              raise SystemExit("Unexpected Jinja comment opener remains")
          p.write_text(s)
          PY
      - name: Commit repaired template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/doccraft.html
          git commit -m "Fix Jinja parsing in Mode A animation media queries"
          git push origin HEAD:fix/mode-a-jinja-media-query-syntax
