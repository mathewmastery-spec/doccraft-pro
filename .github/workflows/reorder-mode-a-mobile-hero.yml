name: Set Mode A mobile hero order
on:
  push:
    branches:
      - fix/mode-a-mobile-badge-before-image
permissions:
  contents: write
jobs:
  reorder-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode-a-mobile-badge-before-image
          fetch-depth: 0
      - name: Put workspace badge before image on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("templates/doccraft.html")
          s = p.read_text()
          marker = '</style>\n\n</head>'
          if s.count(marker) != 1:
              raise SystemExit("Could not uniquely locate the Mode A style block")
          css = """
          @media(max-width:700px){
            #documentStudioHome .hero-left{display:contents}
            #documentStudioHome .hero-badge{order:0;align-self:flex-start;margin:0 0 2px}
            #documentStudioHome .hero-visual{order:1;width:100%;max-width:none;margin:0 auto}
            #documentStudioHome .hero-title{order:2;width:100%;margin-top:2px}
            #documentStudioHome .hero-sub{order:3;width:100%}
            #documentStudioHome .hero-btns{order:4;width:100%}
            #documentStudioHome .hero-stats{order:5;width:100%}
          }
          """
          s = s.replace(marker, css + marker, 1)
          p.write_text(s)
          PY
      - name: Commit mobile ordering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/doccraft.html
          git commit -m "Place Mode A workspace badge before image on mobile"
          git push origin HEAD:fix/mode-a-mobile-badge-before-image
