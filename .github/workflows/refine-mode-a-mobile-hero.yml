name: Apply Mode A mobile hero refinement
on:
  push:
    branches:
      - fix/mode-a-mobile-image-first-clean-hero
permissions:
  contents: write
jobs:
  refine-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode-a-mobile-image-first-clean-hero
          fetch-depth: 0
      - name: Remove image caption and put image first on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("templates/doccraft.html")
          s = p.read_text()
          caption = '      <div class="hero-cheer">DOCUMENTS THAT MOVE YOU FORWARD</div>\n'
          if s.count(caption) != 1:
              raise SystemExit("Expected exactly one Mode A image caption")
          s = s.replace(caption, "", 1)
          marker = '</style>\n\n</head>'
          if s.count(marker) != 1:
              raise SystemExit("Could not uniquely locate Mode A image style block")
          mobile = """@media(max-width:700px){
            #documentStudioHome .hero{flex-direction:column}
            #documentStudioHome .hero-visual{order:-1;width:100%;max-width:none;margin:0 auto}
            #documentStudioHome .hero-left{order:0;width:100%}
          }
          """
          s = s.replace(marker, mobile + marker, 1)
          if "DOCUMENTS THAT MOVE YOU FORWARD" in s:
              raise SystemExit("Image caption text still exists")
          p.write_text(s)
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/doccraft.html
          git commit -m "Remove Mode A image caption and place image first on mobile"
          git push origin HEAD:fix/mode-a-mobile-image-first-clean-hero
